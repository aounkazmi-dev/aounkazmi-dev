    <rect x="662" y="135" width="31" height="31" rx="7" fill="#FFBA7A" fill-opacity=".12"/>
    <path d="M679 140L673 151H679L676 162L684 148H678Z" fill="#FFBA7A"/>
    <text x="709" y="157" fill="#E0E7F2" font-size="17">Electricity</text><text x="1054" y="157" fill="#98A3B8" font-size="14">Tracked</text>
    <rect x="662" y="184" width="31" height="31" rx="7" fill="#FFBA7A" fill-opacity=".12"/>
    <path d="M668 196Q677 187 687 196M672 201Q677 196 682 201" fill="none" stroke="#FFBA7A" stroke-width="2" stroke-linecap="round"/><circle cx="677" cy="206" r="1.5" fill="#FFBA7A"/>
    <text x="709" y="206" fill="#E0E7F2" font-size="17">Internet</text><text x="1054" y="206" fill="#98A3B8" font-size="14">Tracked</text>
    <path d="M755 239V271M750 264L755 271L760 264" fill="none" stroke="#FFBA7A" stroke-opacity=".6" stroke-width="2"/>
