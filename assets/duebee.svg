    <rect x="944" y="296" width="21" height="15" rx="2" fill="none" stroke="#FFBA7A" stroke-width="1.5"/><path d="M944 297L954 305L965 297" fill="none" stroke="#FFBA7A" stroke-width="1.5"/>
