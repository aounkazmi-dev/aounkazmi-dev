<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">DueBee — bills, reminders, and a clearer picture</title>
  <desc id="desc">A conceptual illustration of DueBee tracking bills and connecting scheduled checks to automated email reminders.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFBA7A" stop-opacity=".08"/><stop offset="1" stop-color="#FFBA7A" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#252D3A" stroke-opacity=".24"/></pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="418" rx="22" fill="#0B0E14" stroke="#252D3A" stroke-width="2"/>
  <rect x="610" y="2" width="588" height="416" rx="20" fill="url(#grid)"/>
  <rect x="610" y="2" width="588" height="416" rx="20" fill="url(#wash)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="46" fill="#FFBA7A" font-size="14" font-weight="700" letter-spacing="3">03 / FULL-STACK ENGINEERING</text>
    <text x="42" y="118" fill="#F3F6FC" font-size="62" font-weight="700" letter-spacing="-2">DueBee</text>
    <text x="42" y="160" fill="#FFBA7A" font-size="24">Less bill chaos. More clarity.</text>
    <text x="42" y="212" fill="#98A3B8" font-size="20">Track bills, automate email reminders,</text>
    <text x="42" y="243" fill="#98A3B8" font-size="20">and see patterns in your spending.</text>
    <path d="M42 282H548" stroke="#252D3A"/>
    <text x="42" y="316" fill="#E0E7F2" font-size="17">React</text><circle cx="106" cy="310" r="2" fill="#FFBA7A"/>
    <text x="120" y="316" fill="#E0E7F2" font-size="17">FastAPI</text><circle cx="206" cy="310" r="2" fill="#FFBA7A"/>
    <text x="220" y="316" fill="#E0E7F2" font-size="17">PostgreSQL</text><circle cx="336" cy="310" r="2" fill="#FFBA7A"/>
    <text x="350" y="316" fill="#E0E7F2" font-size="17">Tailwind</text>
    <text x="42" y="378" fill="#98A3B8" font-size="13" letter-spacing="2">AN EVERYDAY PROBLEM. ENGINEERED.</text>
    <text x="641" y="46" fill="#98A3B8" font-size="12" letter-spacing="2">CONCEPT / REMINDER PIPELINE</text>
    <rect x="640" y="66" width="516" height="173" rx="12" fill="#121722" stroke="#252D3A"/>
    <text x="662" y="98" fill="#E0E7F2" font-size="18" font-weight="700">Your bills, together</text>
