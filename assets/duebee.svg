    <circle cx="665" cy="303" r="9" fill="none" stroke="#FFBA7A" stroke-width="1.5"/><path d="M665 297V303L669 306" fill="none" stroke="#FFBA7A" stroke-width="1.5"/>
    <text x="684" y="310" fill="#E0E7F2" font-size="17">Scheduled checks</text>
